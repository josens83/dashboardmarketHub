version: '3.8'

services:
  # 프론트엔드 (React + Vite)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NODE_ENV=production
    volumes:
      # SSL 인증서 (Let's Encrypt)
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - app-network
    restart: unless-stopped

  # 백엔드 API (선택사항 - 실제 백엔드 구현 시 사용)
  # backend:
